[project]
name = "incidentgraph"
version = "0.1.0"
description = "Evidence-grounded infrastructure incident investigation"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.141.1",
  "httpx>=0.28,<1",
  "langchain==1.4.2",
  "langchain-openai>=1.6,<2",
  "langgraph==1.2.11",
  "langgraph-checkpoint-postgres==3.1.2",
  "neo4j-graphrag==1.19.0",
  "opentelemetry-api>=1.37,<2",
  "opentelemetry-sdk>=1.37,<2",
  "prometheus-client>=0.22,<1",
  "psycopg[binary,pool]>=3.2,<4",
  "pydantic>=2.12,<3",
  "pydantic-settings>=2.10,<3",
  "redis==8.1.0",
  "sentence-transformers==6.1.0",
  "structlog>=25,<26",
  "uvicorn[standard]>=0.35,<1",
]

[project.scripts]
incidentgraph = "incidentgraph.cli:main"
incidentgraph-api = "incidentgraph.api:main"
incidentgraph-lab = "incidentgraph.lab_cli:main"
incidentgraph-lab-service = "incidentgraph.lab_service:main"
incidentgraph-ingest = "incidentgraph.ingestion:main"
incidentgraph-retrieval = "incidentgraph.retrieval:main"
incidentgraph-worker = "incidentgraph.worker:main"

[dependency-groups]
dev = [
  "mypy>=1.18,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.2,<2",
  "pytest-cov>=7,<8",
  "ruff>=0.13,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/incidentgraph"]

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "integration: requires real local services",
  "lab_integration: requires the running Phase 2 lab",
  "graph_integration: requires the running Neo4j service and local embedding model",
  "retrieval_integration: requires Phase 3 graph data and local embedding model",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S104", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["incidentgraph"]

[tool.coverage.run]
source = ["incidentgraph"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
