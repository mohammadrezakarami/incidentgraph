global:
  scrape_interval: 1s
  evaluation_interval: 1s

scrape_configs:
  - job_name: gateway
    static_configs:
      - targets: ["gateway:8080"]
  - job_name: checkout
    static_configs:
      - targets: ["checkout:8080"]
  - job_name: payments
    static_configs:
      - targets: ["payments:8080"]
