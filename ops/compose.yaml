name: incidentgraph

services:
  app-db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: incidentgraph
      POSTGRES_USER: incidentgraph
      POSTGRES_PASSWORD: ${INCIDENTGRAPH_APP_DB_PASSWORD:?set INCIDENTGRAPH_APP_DB_PASSWORD}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - app-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U incidentgraph -d incidentgraph"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 768m
    cpus: 1.0
    restart: unless-stopped

  lab-db:
    image: postgres:18.6-bookworm@sha256:3725f4e2499eef5134592b3b4ab79a543ed7f8e533b05b5b637af926630f6650
    environment:
      POSTGRES_DB: lab
      POSTGRES_USER: lab
      POSTGRES_PASSWORD: ${INCIDENTGRAPH_LAB_DB_PASSWORD:?set INCIDENTGRAPH_LAB_DB_PASSWORD}
    ports:
      - "127.0.0.1:55433:5432"
    volumes:
      - lab-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lab -d lab"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    cpus: 1.0
    restart: unless-stopped

  neo4j:
    image: neo4j:2026.09.0@sha256:29efb5ebfb51ec75545a945bc3ac0bdfbeb6bc2686a8ae5053fe0f4dcc926441
    environment:
      NEO4J_AUTH: neo4j/${INCIDENTGRAPH_NEO4J_PASSWORD:?set INCIDENTGRAPH_NEO4J_PASSWORD}
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 512m
      NEO4J_server_directories_logs: /logs
    ports:
      - "127.0.0.1:57474:7474"
      - "127.0.0.1:57687:7687"
    volumes:
      - neo4j-data:/data
      - neo4j-logs:/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "cypher-shell -u neo4j -p \"$${NEO4J_AUTH#neo4j/}\" 'RETURN 1' >/dev/null 2>&1",
        ]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 1536m
    cpus: 2.0
    restart: unless-stopped

  redis:
    image: redis:8.10.1@sha256:8a1efc5f479551822b47424ccae982026b633f28818eab0387348120a61e10e2
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "96mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20
    mem_limit: 128m
    cpus: 0.5
    restart: unless-stopped

  gateway:
    image: incidentgraph-lab:phase2
    build:
      context: ..
      dockerfile: lab.Dockerfile
    environment:
      LAB_SERVICE: gateway
      LAB_DATABASE_DSN: postgresql://lab:${INCIDENTGRAPH_LAB_DB_PASSWORD}@lab-db:5432/lab
      LAB_REDIS_URL: redis://redis:6379/0
      LAB_CONTROL_TOKEN: ${INCIDENTGRAPH_LAB_CONTROL_TOKEN:?set INCIDENTGRAPH_LAB_CONTROL_TOKEN}
      LAB_CHECKOUT_URL: http://checkout:8080
      LAB_PAYMENTS_URL: http://payments:8080
      LAB_LOG_DIR: /var/log/incidentgraph
      LAB_TRACE_DIR: /var/traces/incidentgraph
      LAB_DEPLOYMENT_VERSION: gateway-v1.0.0
    ports:
      - "127.0.0.1:58080:8080"
    volumes:
      - ../data/runtime/lab-logs:/var/log/incidentgraph
      - ../data/runtime/lab-traces:/var/traces/incidentgraph
    depends_on:
      checkout:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.75
    restart: unless-stopped
    logging:
      options:
        max-size: 5m
        max-file: "2"

  checkout:
    image: incidentgraph-lab:phase2
    build:
      context: ..
      dockerfile: lab.Dockerfile
    environment:
      LAB_SERVICE: checkout
      LAB_DATABASE_DSN: postgresql://lab:${INCIDENTGRAPH_LAB_DB_PASSWORD}@lab-db:5432/lab
      LAB_REDIS_URL: redis://redis:6379/0
      LAB_CONTROL_TOKEN: ${INCIDENTGRAPH_LAB_CONTROL_TOKEN:?set INCIDENTGRAPH_LAB_CONTROL_TOKEN}
      LAB_CHECKOUT_URL: http://checkout:8080
      LAB_PAYMENTS_URL: http://payments:8080
      LAB_LOG_DIR: /var/log/incidentgraph
      LAB_TRACE_DIR: /var/traces/incidentgraph
      LAB_DEPLOYMENT_VERSION: checkout-v1.0.0
      LAB_DB_POOL_SIZE: 4
    ports:
      - "127.0.0.1:58081:8080"
    volumes:
      - ../data/runtime/lab-logs:/var/log/incidentgraph
      - ../data/runtime/lab-traces:/var/traces/incidentgraph
    depends_on:
      lab-db:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.75
    restart: unless-stopped
    logging:
      options:
        max-size: 5m
        max-file: "2"

  payments:
    image: incidentgraph-lab:phase2
    build:
      context: ..
      dockerfile: lab.Dockerfile
    environment:
      LAB_SERVICE: payments
      LAB_DATABASE_DSN: postgresql://lab:${INCIDENTGRAPH_LAB_DB_PASSWORD}@lab-db:5432/lab
      LAB_REDIS_URL: redis://redis:6379/0
      LAB_CONTROL_TOKEN: ${INCIDENTGRAPH_LAB_CONTROL_TOKEN:?set INCIDENTGRAPH_LAB_CONTROL_TOKEN}
      LAB_CHECKOUT_URL: http://checkout:8080
      LAB_PAYMENTS_URL: http://payments:8080
      LAB_LOG_DIR: /var/log/incidentgraph
      LAB_TRACE_DIR: /var/traces/incidentgraph
      LAB_DEPLOYMENT_VERSION: payments-v1.0.0
      LAB_DB_POOL_SIZE: 4
    ports:
      - "127.0.0.1:58082:8080"
    volumes:
      - ../data/runtime/lab-logs:/var/log/incidentgraph
      - ../data/runtime/lab-traces:/var/traces/incidentgraph
    depends_on:
      lab-db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health/ready').read()"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 256m
    cpus: 0.75
    restart: unless-stopped
    logging:
      options:
        max-size: 5m
        max-file: "2"

  prometheus:
    image: prom/prometheus:v3.14.0@sha256:5ce7540c3c00ef4ab0c9d2c995c6a5b9c421f44b4a115d97a2c7af3b1c21cbb0
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=2h
      - --storage.tsdb.retention.size=256MB
      - --web.enable-lifecycle
    ports:
      - "127.0.0.1:59090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    depends_on:
      gateway:
        condition: service_healthy
      checkout:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:9090/-/ready"]
      interval: 3s
      timeout: 3s
      retries: 30
    mem_limit: 512m
    cpus: 0.75
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.34.1@sha256:0c0a83210471fb50226bcdc2d6611d20ab13ae87e024cc304c94a6a5765c5e65
    profiles: ["model"]
    ports:
      - "127.0.0.1:11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: 10m
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 5s
      timeout: 5s
      retries: 30
    mem_limit: 4096m
    cpus: 8.0
    restart: unless-stopped

volumes:
  app-db-data:
  lab-db-data:
  neo4j-data:
  neo4j-logs:
  prometheus-data:
  ollama-data:
