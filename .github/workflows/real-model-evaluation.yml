name: manual-real-model-evaluation-guard

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-frozen-result:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: 0.12.17
          python-version: 3.12.14
      - name: Install the frozen environment
        run: uv sync --frozen --dev
      - name: Verify sealed zero-cost evidence without a model call
        run: |
          uv run python -m incidentgraph.phase9_v4_runner verify-freeze
          uv run python -m incidentgraph.release verify-evaluation
      - name: Explain the explicit budget boundary
        run: echo "A new stochastic model run is not authorized here. Use phase9_v4_colab.ipynb on free Colab only after separately approving a new frozen evaluation."
